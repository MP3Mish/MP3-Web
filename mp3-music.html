<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MPƎ — Everything Else</title>
<link rel="icon" type="image/png" href="assets/img_50d15dd6.png">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root { --cursor: url("assets/cursor.svg") 10 10, crosshair; }
html, body {
  background: #fff; color: #000;
  font-family: 'Share Tech Mono', monospace;
  cursor: var(--cursor); min-height: 100vh;
}
a, button, input { cursor: var(--cursor); }
header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 40px; border-bottom: 1px solid #eee;
}
.head-logo img { height: 30px; width: auto; display: block; }
main {
  max-width: 640px; margin: 0 auto;
  padding: 40px 24px 120px;
  display: flex; flex-direction: column; gap: 54px;
}
.section-title {
  font-size: 10px; letter-spacing: 5px; text-transform: uppercase;
  margin-bottom: 16px;
}
.section-title::before { content: '→ '; color: #f00; }
.blurb { font-size: 10px; letter-spacing: 1px; line-height: 2.1; color: #888; margin-bottom: 14px; }

/* mailing list */
.ml-row { display: flex; gap: 0; max-width: 420px; }
.ml-row input {
  flex: 1; border: 1px solid #000; border-right: none;
  background: none; padding: 12px 14px;
  font-family: 'Share Tech Mono', monospace; font-size: 10px; letter-spacing: 1px;
  outline: none;
}
.ml-row button {
  border: 1px solid #000; background: #000; color: #fff;
  font-family: 'Share Tech Mono', monospace;
  font-size: 9px; letter-spacing: 3px; text-transform: uppercase;
  padding: 12px 18px; transition: background 0.15s;
}
.ml-row button:hover { background: #333; }

.link-list { display: flex; flex-direction: column; }
.link-list a {
  display: flex; justify-content: space-between;
  padding: 13px 4px; border-bottom: 1px solid #f2f2f2;
  font-size: 10px; letter-spacing: 3px; text-transform: uppercase;
  color: #000; text-decoration: none; transition: background 0.15s;
}
.link-list a:hover { background: #f7f7f7; }
.link-list a::after { content: '→'; color: #ccc; }

.bottom-links {
  position: fixed; bottom: 0; left: 0; right: 0;
  display: flex; align-items: center; justify-content: center;
  gap: 40px; padding: 14px;
  font-size: 9px; letter-spacing: 4px; text-transform: uppercase;
  border-top: 1px solid #f0f0f0; background: rgba(255,255,255,0.95);
  z-index: 50;
}
.bottom-links a { color: #000; text-decoration: none; transition: opacity 0.2s; }
.bottom-links a:hover { opacity: 0.3; }
@media (max-width: 600px) { header { padding: 14px 20px; } main { padding: 28px 16px 120px; } }
</style>
</head>
<body>

<header>
  <a class="head-logo" href="index.html"><img src="assets/logo-black.png" alt="MPƎ"></a>
</header>

<main>

  <section>
    <div class="section-title">Mailing List</div>
    <div class="blurb">Drops, restocks, and nothing else.</div>
    <div class="ml-row">
      <input type="email" id="ml-email" placeholder="your@email.com" autocomplete="email">
      <button onclick="joinList()">Join</button>
    </div>
  </section>

  <section>
    <div class="section-title">Contact / Returns</div>
    <div class="blurb">Order issues, returns, wholesale, anything — email with your order number and we'll get back to you.</div>
    <div class="link-list">
      <a href="mailto:Misha.MP3@outlook.com?subject=MP%C6%8E%20—%20Order%20Enquiry">Email Us</a>
      <a href="mp3-terms.html">Terms &amp; Shipping</a>
    </div>
  </section>

  <section>
    <div class="section-title">Elsewhere</div>
    <div class="link-list">
      <a href="https://www.instagram.com/mp3inc/" target="_blank" rel="noopener">Instagram</a>
      <a href="https://www.youtube.com/@MP%C6%8E" target="_blank" rel="noopener">YouTube</a>
      <a href="https://open.spotify.com/playlist/5wjrDxEc2YOO9acKqpU4ZJ" target="_blank" rel="noopener">Spotify</a>
    </div>
  </section>

</main>

<div class="bottom-links">
  <a href="index.html">Home</a>
  <a href="mp3-media.html">Media</a>
  <a href="mp3-product.html">Products</a>
</div>

<script>
function joinList() {
  var e = document.getElementById('ml-email').value.trim();
  if (!e || e.indexOf('@') < 1) return;
  if (window.MP3Sound) MP3Sound.scratch();
  window.location.href = 'mailto:Misha.MP3@outlook.com?subject=MP%C6%8E%20Mailing%20List&body=' +
    encodeURIComponent('Add me to the list: ' + e);
}
</script>
<script src="assets/mp3-sound.js"></script>
</body>
</html>
