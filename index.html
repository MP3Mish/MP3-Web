<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MPƎ</title>
<meta name="description" content="MPƎ — Season 01. Work Denim. Playa Denim.">
<link rel="icon" type="image/png" href="assets/img_50d15dd6.png">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%;
  background: #fff;
  font-family: 'Share Tech Mono', monospace;
  cursor: url("assets/cursor.svg") 10 10, crosshair;
  overflow: hidden;
}
.stage {
  width: 100%; height: 100vh;
  display: flex; align-items: center; justify-content: center;
}
.logo-wrap { position: relative; width: min(520px, 80vw); }
.logo-wrap img {
  width: 100%; height: auto; display: block;
  pointer-events: none; user-select: none;
}
/* Zones over the logo. Image 900x636.
   Content: x 20.2%–80.8%, y 20.3%–75.1%.
   Guides: M|P 46.7%, P|E 60.1% (diagonal). */
.zone {
  position: absolute; top: 20.3%; height: 54.8%;
  cursor: url("assets/cursor.svg") 10 10, crosshair;
}
#z-m { left: 20.2%; width: 22.3%; }
#z-p { left: 42.5%; width: 21.5%; }
#z-e { left: 55.5%; width: 25.3%; }

/* Pre-tinted colour layers, clipped per letter, revealed by opacity */
.letter-layer {
  position: absolute; top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none; user-select: none;
  opacity: 0;
  transition: opacity 0.18s ease;
}
.layer-m { clip-path: inset(20.3% 57.5% 24.9% 20.2%); }
.layer-p { clip-path: polygon(42.5% 20.3%, 64.0% 20.3%, 60.0% 47.7%, 55.5% 75.1%, 42.5% 75.1%); }
.layer-e { clip-path: polygon(64.0% 20.3%, 80.8% 20.3%, 80.8% 75.1%, 55.5% 75.1%, 60.0% 47.7%); }
.letter-layer.on { opacity: 1; }

/* INTRO: subtle breathe so visitors know the logo is live */
@keyframes breathe {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.012); }
}
.logo-wrap.idle { animation: breathe 4s ease-in-out infinite; }

.bottom-links {
  position: fixed; bottom: 0; left: 0; right: 0;
  display: flex; align-items: center; justify-content: center;
  gap: 40px; padding: 20px;
  font-size: 10px; letter-spacing: 4px; text-transform: uppercase;
}
.bottom-links a { color: #000; text-decoration: none; transition: opacity 0.2s; }
.bottom-links a:hover { opacity: 0.3; }

.tip {
  position: fixed; pointer-events: none; z-index: 100;
  font-size: 10px; letter-spacing: 3px; text-transform: uppercase;
  color: #000; opacity: 0; transition: opacity 0.15s;
  transform: translate(-50%, -200%);
  white-space: nowrap;
}
.tip.show { opacity: 1; }

/* Touch devices: labels always visible under logo */
.touch-labels { display: none; }
@media (hover: none) {
  .touch-labels {
    display: flex; justify-content: center; gap: 30px;
    margin-top: 24px;
    font-size: 9px; letter-spacing: 3px; text-transform: uppercase;
  }
  .touch-labels span { color: #000; }
}
</style>
</head>
<body>

<div class="stage">
  <div>
    <div class="logo-wrap" id="logo-wrap">
      <img src="assets/logo-black.png" alt="MPƎ" id="base-img"/>
      <img src="assets/logo-red.png"   alt="" class="letter-layer layer-m" id="layer-m"/>
      <img src="assets/logo-green.png" alt="" class="letter-layer layer-p" id="layer-p"/>
      <img src="assets/logo-blue.png"  alt="" class="letter-layer layer-e" id="layer-e"/>
      <div class="zone" id="z-m"></div>
      <div class="zone" id="z-p"></div>
      <div class="zone" id="z-e"></div>
    </div>
    <div class="touch-labels">
      <span>M → Media</span><span>P → Products</span><span>Ǝ → Everything Else</span>
    </div>
  </div>
</div>

<div class="bottom-links">
  <a href="https://www.instagram.com/mp3inc/" target="_blank" rel="noopener">Instagram</a>
  <a href="https://www.youtube.com/@MP%C6%8E" target="_blank" rel="noopener">YouTube</a>
  <a href="https://open.spotify.com/playlist/5wjrDxEc2YOO9acKqpU4ZJ" target="_blank" rel="noopener">Spotify</a>
</div>

<div class="tip" id="tip"></div>

<script>
const zones = [
  { id: 'z-m', layer: 'layer-m', label: 'Media',           href: 'mp3-media.html' },
  { id: 'z-p', layer: 'layer-p', label: 'Products',        href: 'mp3-product.html' },
  { id: 'z-e', layer: 'layer-e', label: 'Everything Else', href: 'mp3-music.html' },
];
const tip = document.getElementById('tip');
const wrap = document.getElementById('logo-wrap');

zones.forEach(({ id, layer, label, href }) => {
  const zone = document.getElementById(id);
  const lyr  = document.getElementById(layer);
  zone.addEventListener('mouseenter', () => {
    lyr.classList.add('on');
    tip.textContent = label;
    tip.className = 'tip show';
  });
  zone.addEventListener('mousemove', e => {
    tip.style.left = e.clientX + 'px';
    tip.style.top  = e.clientY + 'px';
  });
  zone.addEventListener('mouseleave', () => {
    lyr.classList.remove('on');
    tip.className = 'tip';
  });
  zone.addEventListener('click', () => {
    if (window.MP3Sound) MP3Sound.scratch();
    setTimeout(() => { window.location.href = href; }, 200);
  });
});

/* INTRO ANIMATION — letters light up in sequence (R, G, B), twice,
   then the logo settles into a slow breathe. Tells visitors it's interactive. */
const seq = ['layer-m', 'layer-p', 'layer-e'];
let step = 0;
function flash() {
  if (step >= seq.length * 2) { wrap.classList.add('idle'); return; }
  const lyr = document.getElementById(seq[step % 3]);
  lyr.classList.add('on');
  setTimeout(() => {
    lyr.classList.remove('on');
    step++;
    setTimeout(flash, 90);
  }, 260);
}
setTimeout(flash, 500);
</script>
<script src="assets/mp3-sound.js"></script>
</body>
</html>
