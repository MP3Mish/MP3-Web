<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MPƎ — Media</title>
<meta name="description" content="MPƎ Media — Latest drops, MP3 Radio, and more.">
<link rel="icon" type="image/png" href="img_50d15dd6.png">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root { --cursor: url("cursor.svg") 10 10, crosshair; }
html, body {
  background: #fff; color: #000;
  font-family: 'Share Tech Mono', monospace;
  cursor: var(--cursor);
  min-height: 100vh;
}
a, button { cursor: var(--cursor); }

/* HEADER */
header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 40px;
  border-bottom: 1px solid #eee;
}
.head-logo img { height: 30px; width: auto; display: block; }
.visitors { font-size: 9px; letter-spacing: 3px; text-transform: uppercase; color: #aaa; }

/* TICKER */
.ticker {
  overflow: hidden; white-space: nowrap;
  border-bottom: 1px solid #eee;
  background: #000; color: #fff;
  font-size: 9px; letter-spacing: 4px; text-transform: uppercase;
  padding: 7px 0;
}
.ticker-inner { display: inline-block; animation: tick 30s linear infinite; }
@keyframes tick { from { transform: translateX(0); } to { transform: translateX(-50%); } }

/* LAYOUT */
main {
  max-width: 980px; margin: 0 auto;
  padding: 40px 24px 120px;
  display: flex; flex-direction: column; gap: 60px;
}
.section-title {
  font-size: 10px; letter-spacing: 5px; text-transform: uppercase;
  margin-bottom: 16px; position: relative; display: inline-block;
}
.section-title::before { content: '→ '; color: #f00; }

/* VIDEO */
.video-frame {
  position: relative; width: 100%; padding-top: 56.25%;
  border: 1px solid #000;
}
.video-frame iframe {
  position: absolute; inset: 0; width: 100%; height: 100%; border: 0;
}

/* RADIO */
.radio {
  border: 1px solid #000;
  max-width: 460px;
}
.radio-head {
  display: flex; justify-content: space-between; align-items: center;
  padding: 12px 16px; border-bottom: 1px solid #eee;
  font-size: 9px; letter-spacing: 4px; text-transform: uppercase;
}
.radio-collapse { background: none; border: none; font-family: 'Share Tech Mono', monospace; font-size: 13px; }
.radio-body { padding: 16px; }
.radio.min .radio-body { display: none; }

.np-row { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
/* spinning CD — flat, black ring + hole */
.cd {
  width: 42px; height: 42px; border-radius: 50%;
  border: 1px solid #000; position: relative; flex-shrink: 0;
}
.cd::after {
  content: ''; position: absolute; top: 50%; left: 50%;
  width: 10px; height: 10px; border-radius: 50%;
  border: 1px solid #000; transform: translate(-50%, -50%);
}
.cd::before {
  content: ''; position: absolute; top: 3px; left: 50%;
  width: 1px; height: 8px; background: #000;
}
.cd.spin { animation: spin 2.2s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.np-info { flex: 1; min-width: 0; }
.np-label { font-size: 8px; letter-spacing: 3px; text-transform: uppercase; color: #aaa; }
.np-title { font-size: 12px; letter-spacing: 1px; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.np-artist { font-size: 9px; letter-spacing: 2px; color: #aaa; margin-top: 2px; }
.np-time { font-size: 9px; letter-spacing: 1px; color: #aaa; }

.radio-controls { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
.rc-btn {
  background: none; border: 1px solid #000;
  font-family: 'Share Tech Mono', monospace; font-size: 10px;
  padding: 7px 12px; transition: all 0.15s;
}
.rc-btn:hover { background: #000; color: #fff; }
.rc-vol { display: flex; align-items: center; gap: 6px; margin-left: auto; font-size: 8px; letter-spacing: 2px; color: #aaa; }
.rc-vol input {
  width: 70px; accent-color: #000; cursor: var(--cursor);
}

.tracklist { border-top: 1px solid #eee; }
.track {
  display: flex; align-items: baseline; gap: 12px;
  padding: 9px 4px; border-bottom: 1px solid #f4f4f4;
  font-size: 10px; letter-spacing: 1px;
  transition: background 0.15s;
}
.track:hover { background: #f7f7f7; }
.track.playing { background: #000; color: #fff; }
.track.playing .t-artist { color: #999; }
.t-num { font-size: 9px; color: #ccc; width: 18px; }
.track.playing .t-num { color: #f00; }
.t-name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.t-artist { font-size: 9px; letter-spacing: 2px; color: #aaa; }

/* hidden soundcloud iframes */
#sc-holder { position: absolute; width: 1px; height: 1px; overflow: hidden; opacity: 0.01; pointer-events: none; }

/* MINESWEEPER */
.mines-open-btn {
  background: none; border: 1px solid #000;
  font-family: 'Share Tech Mono', monospace;
  font-size: 10px; letter-spacing: 3px; text-transform: uppercase;
  padding: 12px 20px; transition: all 0.15s;
}
.mines-open-btn:hover { background: #000; color: #fff; }
.mines-pop {
  display: none;
  position: fixed; top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  background: #fff; border: 1px solid #000;
  z-index: 300; padding: 16px;
}
.mines-pop.open { display: block; }
.mines-head {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 12px;
  font-size: 9px; letter-spacing: 3px; text-transform: uppercase;
}
.mines-head button { background: none; border: none; font-family: 'Share Tech Mono', monospace; font-size: 13px; }
.mines-stats { display: flex; gap: 20px; font-size: 9px; letter-spacing: 2px; color: #aaa; margin-bottom: 10px; }
.mines-grid { display: grid; grid-template-columns: repeat(9, 26px); gap: 1px; background: #ddd; border: 1px solid #ddd; }
.cell {
  width: 26px; height: 26px; background: #f2f2f2;
  border: none; font-family: 'Share Tech Mono', monospace;
  font-size: 11px; line-height: 1; padding: 0;
  transition: background 0.1s;
}
.cell:hover { background: #e6e6e6; }
.cell.rev { background: #fff; }
.cell.mine { background: #f00; color: #fff; }
.cell.flag { color: #f00; }
.mines-msg { font-size: 9px; letter-spacing: 2px; margin-top: 10px; text-transform: uppercase; text-align: center; min-height: 12px; }

/* FOOTER */
.bottom-links {
  position: fixed; bottom: 0; left: 0; right: 0;
  display: flex; align-items: center; justify-content: center;
  gap: 40px; padding: 14px;
  font-size: 9px; letter-spacing: 4px; text-transform: uppercase;
  border-top: 1px solid #f0f0f0;
  background: rgba(255,255,255,0.95);
  z-index: 50;
}
.bottom-links a { color: #000; text-decoration: none; transition: opacity 0.2s; }
.bottom-links a:hover { opacity: 0.3; }

@media (max-width: 600px) {
  header { padding: 14px 20px; }
  main { padding: 28px 16px 120px; gap: 44px; }
  .radio { max-width: 100%; }
  .bottom-links { gap: 20px; }
  .mines-grid { grid-template-columns: repeat(9, 30px); }
  .cell { width: 30px; height: 30px; }
}
</style>
</head>
<body>

<header>
  <a class="head-logo" href="index.html"><img src="logo-black.png" alt="MPƎ"></a>
  <span class="visitors" id="visitors">Visitors: ————</span>
</header>

<div class="ticker"><div class="ticker-inner" id="ticker-inner"></div></div>

<main>

  <section>
    <div class="section-title">Latest Drop</div>
    <div class="video-frame">
      <iframe src="https://www.youtube.com/embed/4bAol94R2rA?rel=0&modestbranding=1"
        title="MPƎ — Latest Drop" allow="accelerometer; encrypted-media; picture-in-picture"
        allowfullscreen></iframe>
    </div>
  </section>

  <section>
    <div class="section-title">MPƎ Radio</div>
    <div class="radio" id="radio">
      <div class="radio-head">
        <span>Now Playing</span>
        <button class="radio-collapse" id="radio-collapse" title="Collapse">−</button>
      </div>
      <div class="radio-body">
        <div class="np-row">
          <div class="cd" id="cd"></div>
          <div class="np-info">
            <div class="np-label">Track</div>
            <div class="np-title" id="np-title">—</div>
            <div class="np-artist" id="np-artist">—</div>
          </div>
          <div class="np-time" id="np-time">0:00</div>
        </div>
        <div class="radio-controls">
          <button class="rc-btn" id="btn-prev">◀◀</button>
          <button class="rc-btn" id="btn-play">▶</button>
          <button class="rc-btn" id="btn-next">▶▶</button>
          <div class="rc-vol">Vol <input type="range" id="vol" min="0" max="100" value="70"></div>
        </div>
        <div class="tracklist" id="tracklist"></div>
      </div>
    </div>
  </section>

  <section>
    <div class="section-title">Arcade</div>
    <button class="mines-open-btn" onclick="openMines()">💣 Minesweeper</button>
  </section>

</main>

<!-- Hidden SoundCloud players -->
<div id="sc-holder"></div>

<!-- Minesweeper popout -->
<div class="mines-pop" id="mines-pop">
  <div class="mines-head">
    <span>Minesweeper</span>
    <button onclick="closeMines()">×</button>
  </div>
  <div class="mines-stats">
    <span id="m-time">Time: 0s</span>
    <span id="m-flags">Flags: 0/10</span>
    <span><button style="background:none;border:none;font-family:inherit;font-size:11px;" onclick="minesReset()">↺</button></span>
  </div>
  <div class="mines-grid" id="mines-grid"></div>
  <div class="mines-msg" id="mines-msg">Click a cell to start · Right-click to flag</div>
</div>

<div class="bottom-links">
  <a href="https://www.instagram.com/mp3inc/" target="_blank" rel="noopener">Instagram</a>
  <a href="https://www.youtube.com/@MP%C6%8E" target="_blank" rel="noopener">YouTube</a>
  <a href="https://open.spotify.com/playlist/5wjrDxEc2YOO9acKqpU4ZJ" target="_blank" rel="noopener">Spotify</a>
</div>

<script src="https://w.soundcloud.com/player/api.js"></script>
<script>
/* ---------- TICKER ---------- */
(function () {
  var txt = ' MPƎ · SEASON 01 · WORK DENIM · PLAYA DENIM · MPƎ RADIO · MELBOURNE ·';
  document.getElementById('ticker-inner').textContent = txt.repeat(8);
})();

/* ---------- VISITOR COUNTER ---------- */
(function () {
  var el = document.getElementById('visitors');
  fetch('https://api.counterapi.dev/v1/mp3site/media/up')
    .then(function (r) { return r.json(); })
    .then(function (d) {
      var n = (d && (d.count || (d.data && d.data.count))) || 0;
      el.textContent = 'Visitors: ' + String(n).padStart(4, '0');
    })
    .catch(function () {
      var n = (localStorage.getItem('mp3-v') || 0) * 1 + 1;
      localStorage.setItem('mp3-v', n);
      el.textContent = 'Visitors: ' + String(n).padStart(4, '0');
    });
})();

/* ---------- MPƎ RADIO ---------- */
var TRACKS = [
  { title: 'Can You Forgive Me',        artist: 'MPƎ',           url: 'https://soundcloud.com/why_mel/can-u-forgive-me' },
  { title: 'Last Flight to Wherever',   artist: 'MPƎ',           url: 'https://soundcloud.com/nirrro/harrison-bdp-last-flight-to-wherever' },
  { title: '你哈 你哈 你哈',              artist: 'MPƎ',           url: 'https://soundcloud.com/n9mpjexfnhan/z0qiqin_bi0h4' },
  { title: 'Prince of Denmark',         artist: 'Manndarin',     url: 'https://soundcloud.com/manndarin/16-prince-of-denmark-gs' },
  { title: 'U.S Embassy Bombing',       artist: 'Genom Records', url: 'https://soundcloud.com/genomrecords/04-us-embassy-bombing' }
];
var widgets = [], current = 0, playing = false, volume = 70;

var SC_OK = typeof SC !== 'undefined';
var holder = document.getElementById('sc-holder');
TRACKS.forEach(function (t, i) {
  if (!SC_OK) { widgets[i] = { play:function(){}, pause:function(){}, setVolume:function(){}, bind:function(){} }; return; }
  var f = document.createElement('iframe');
  f.width = '100%'; f.height = '80'; f.allow = 'autoplay';
  f.src = 'https://w.soundcloud.com/player/?url=' + encodeURIComponent(t.url) +
    '&auto_play=false&hide_related=true&show_comments=false&show_user=false&show_reposts=false&visual=false';
  holder.appendChild(f);
  widgets[i] = SC.Widget(f);
});

var npTitle = document.getElementById('np-title'),
    npArtist = document.getElementById('np-artist'),
    npTime = document.getElementById('np-time'),
    cd = document.getElementById('cd'),
    btnPlay = document.getElementById('btn-play');

function fmt(ms) {
  var s = Math.floor(ms / 1000);
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}

function loadTrack(i, autoplay) {
  if (playing) widgets[current].pause();
  current = i;
  var t = TRACKS[i];
  npTitle.textContent = t.title;
  npArtist.textContent = t.artist;
  document.querySelectorAll('.track').forEach(function (el, j) {
    el.classList.toggle('playing', j === i);
  });
  widgets[i].setVolume(volume);
  if (autoplay) { widgets[i].play(); }
}

function setPlaying(p) {
  playing = p;
  btnPlay.textContent = p ? '❚❚' : '▶';
  cd.classList.toggle('spin', p);
}

if (SC_OK) widgets.forEach(function (w, i) {
  w.bind(SC.Widget.Events.PLAY,  function () { if (i === current) setPlaying(true); });
  w.bind(SC.Widget.Events.PAUSE, function () { if (i === current) setPlaying(false); });
  w.bind(SC.Widget.Events.FINISH, function () {
    if (i === current) loadTrack((current + 1) % TRACKS.length, true);
  });
  w.bind(SC.Widget.Events.PLAY_PROGRESS, function (e) {
    if (i === current) npTime.textContent = fmt(e.currentPosition);
  });
});

btnPlay.addEventListener('click', function () {
  if (playing) widgets[current].pause();
  else widgets[current].play();
});
document.getElementById('btn-next').addEventListener('click', function () {
  loadTrack((current + 1) % TRACKS.length, playing || true);
});
document.getElementById('btn-prev').addEventListener('click', function () {
  loadTrack((current - 1 + TRACKS.length) % TRACKS.length, playing || true);
});
document.getElementById('vol').addEventListener('input', function (e) {
  volume = e.target.value * 1;
  widgets[current].setVolume(volume);
});

/* tracklist */
var tl = document.getElementById('tracklist');
TRACKS.forEach(function (t, i) {
  var d = document.createElement('div');
  d.className = 'track';
  d.innerHTML = '<span class="t-num">' + String(i + 1).padStart(2, '0') + '</span>' +
    '<span class="t-name">' + t.title + '</span><span class="t-artist">' + t.artist + '</span>';
  d.addEventListener('click', function () { loadTrack(i, true); });
  tl.appendChild(d);
});
loadTrack(0, false);

/* collapse (collapsible, not draggable) */
document.getElementById('radio-collapse').addEventListener('click', function () {
  var r = document.getElementById('radio');
  r.classList.toggle('min');
  this.textContent = r.classList.contains('min') ? '+' : '−';
});

/* keyboard: space = play/pause, ←/→ = prev/next (ignored while typing) */
document.addEventListener('keydown', function (e) {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space') { e.preventDefault(); btnPlay.click(); }
  if (e.code === 'ArrowRight') document.getElementById('btn-next').click();
  if (e.code === 'ArrowLeft')  document.getElementById('btn-prev').click();
});

/* ---------- MINESWEEPER (9x9, 10 mines) ---------- */
var SIZE = 9, MINES = 10;
var grid, revealed, flagged, started, dead, timer, secs;

function minesReset() {
  grid = []; revealed = 0; flagged = 0; started = false; dead = false; secs = 0;
  clearInterval(timer);
  document.getElementById('m-time').textContent = 'Time: 0s';
  document.getElementById('m-flags').textContent = 'Flags: 0/' + MINES;
  document.getElementById('mines-msg').textContent = 'Click a cell to start · Right-click to flag';
  var g = document.getElementById('mines-grid');
  g.innerHTML = '';
  for (var r = 0; r < SIZE; r++) {
    grid[r] = [];
    for (var c = 0; c < SIZE; c++) {
      grid[r][c] = { mine: false, n: 0, rev: false, flag: false };
      (function (r, c) {
        var b = document.createElement('button');
        b.className = 'cell'; b.id = 'c' + r + '_' + c;
        b.addEventListener('click', function () { reveal(r, c); });
        b.addEventListener('contextmenu', function (e) { e.preventDefault(); flag(r, c); });
        g.appendChild(b);
      })(r, c);
    }
  }
}

function plant(sr, sc) {
  var placed = 0;
  while (placed < MINES) {
    var r = Math.floor(Math.random() * SIZE), c = Math.floor(Math.random() * SIZE);
    if (grid[r][c].mine || (Math.abs(r - sr) <= 1 && Math.abs(c - sc) <= 1)) continue;
    grid[r][c].mine = true; placed++;
  }
  for (var r = 0; r < SIZE; r++) for (var c = 0; c < SIZE; c++) {
    var n = 0;
    around(r, c, function (rr, cc) { if (grid[rr][cc].mine) n++; });
    grid[r][c].n = n;
  }
  timer = setInterval(function () {
    secs++;
    document.getElementById('m-time').textContent = 'Time: ' + secs + 's';
  }, 1000);
}

function around(r, c, fn) {
  for (var dr = -1; dr <= 1; dr++) for (var dc = -1; dc <= 1; dc++) {
    if (!dr && !dc) continue;
    var rr = r + dr, cc = c + dc;
    if (rr >= 0 && rr < SIZE && cc >= 0 && cc < SIZE) fn(rr, cc);
  }
}

function reveal(r, c) {
  if (dead || grid[r][c].rev || grid[r][c].flag) return;
  if (!started) { started = true; plant(r, c); }
  var cell = grid[r][c], el = document.getElementById('c' + r + '_' + c);
  cell.rev = true; revealed++;
  el.classList.add('rev');
  if (cell.mine) {
    el.classList.add('mine'); el.textContent = '✱';
    dead = true; clearInterval(timer);
    document.getElementById('mines-msg').textContent = 'Boom. ↺ to retry';
    for (var rr = 0; rr < SIZE; rr++) for (var cc = 0; cc < SIZE; cc++) {
      if (grid[rr][cc].mine) {
        var e2 = document.getElementById('c' + rr + '_' + cc);
        e2.classList.add('mine'); e2.textContent = '✱';
      }
    }
    return;
  }
  if (cell.n) el.textContent = cell.n;
  else around(r, c, reveal);
  if (revealed === SIZE * SIZE - MINES) {
    clearInterval(timer);
    document.getElementById('mines-msg').textContent = 'Clear — ' + secs + 's';
  }
}

function flag(r, c) {
  if (dead || grid[r][c].rev) return;
  var cell = grid[r][c], el = document.getElementById('c' + r + '_' + c);
  cell.flag = !cell.flag;
  flagged += cell.flag ? 1 : -1;
  el.textContent = cell.flag ? '⚑' : '';
  el.classList.toggle('flag', cell.flag);
  document.getElementById('m-flags').textContent = 'Flags: ' + flagged + '/' + MINES;
}

function openMines() {
  document.getElementById('mines-pop').classList.add('open');
}
function closeMines() { document.getElementById('mines-pop').classList.remove('open'); }
minesReset();
</script>
</body>
</html>
