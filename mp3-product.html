<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MPƎ — Products</title>
<meta name="description" content="MPƎ Season 01 — Work Denim & Playa Denim. $175.">
<link rel="icon" type="image/png" href="assets/img_50d15dd6.png">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root { --cursor: url("assets/cursor.svg") 10 10, crosshair; }
html, body {
  background: #fff; color: #000;
  font-family: 'Share Tech Mono', monospace;
  cursor: var(--cursor);
  min-height: 100vh;
}
a, button { cursor: var(--cursor); }

/* NAV — logo + cart only */
nav {
  position: sticky; top: 0; z-index: 100;
  background: rgba(255,255,255,0.97);
  border-bottom: 1px solid #eee;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 40px; height: 50px;
}
.nav-logo img { height: 28px; width: auto; display: block; }
.nav-cart {
  font-size: 9px; letter-spacing: 3px; text-transform: uppercase;
  color: #000; text-decoration: none; background: none; border: none;
  border-bottom: 1px solid #000; padding-bottom: 1px;
  font-family: 'Share Tech Mono', monospace;
  transition: opacity 0.2s;
}
.nav-cart:hover { opacity: 0.4; }

/* PRODUCTS */
.products-wrap { display: grid; grid-template-columns: 1fr 1fr; }
.product {
  display: flex; flex-direction: column;
  border-right: 1px solid #eee;
  transition: background 0.25s;
}
.product:last-child { border-right: none; }
.product.work:hover { background: #f0faf0; }
.product.playa:hover { background: #fff0f5; }

.img-wrap {
  position: relative; overflow: hidden; flex: 1;
  min-height: 70vh; background: #fff;
}
.img-wrap img {
  position: absolute; inset: 0; width: 100%; height: 100%;
  object-fit: cover; opacity: 0; transition: opacity 0.4s ease;
  mix-blend-mode: multiply;
}
.img-wrap img.active { opacity: 1; }
.img-dots {
  position: absolute; bottom: 16px; left: 0; right: 0;
  display: flex; justify-content: center; gap: 6px; z-index: 2;
}
.img-dot {
  width: 5px; height: 5px; border-radius: 50%;
  background: rgba(0,0,0,0.15); border: none;
  transition: background 0.2s; padding: 0;
}
.img-dot.active { background: #000; }
.img-arrows {
  position: absolute; top: 50%; left: 0; right: 0;
  transform: translateY(-50%);
  display: flex; justify-content: space-between;
  padding: 0 12px; z-index: 2;
  opacity: 0; transition: opacity 0.2s;
}
.img-wrap:hover .img-arrows { opacity: 1; }
.img-arrow {
  background: rgba(255,255,255,0.8); border: 1px solid #eee;
  font-family: 'Share Tech Mono', monospace;
  font-size: 12px; padding: 8px 12px; transition: all 0.15s;
}
.img-arrow:hover { background: #000; color: #fff; border-color: #000; }

/* INFO */
.product-info {
  padding: 28px 32px 32px;
  border-top: 1px solid #eee;
  display: flex; flex-direction: column; gap: 20px;
}
.info-top { display: flex; justify-content: space-between; align-items: baseline; }
.product-name { font-family: 'Bebas Neue', sans-serif; font-size: 42px; letter-spacing: 3px; transition: color 0.25s; }
.work:hover .product-name { color: #3a8a3a; }
.playa:hover .product-name { color: #e0609a; }
.product-price { font-family: 'Bebas Neue', sans-serif; font-size: 28px; letter-spacing: 2px; transition: color 0.25s; }
.work:hover .product-price { color: #3a8a3a; }
.playa:hover .product-price { color: #e0609a; }
.product-desc { font-size: 10px; letter-spacing: 1px; color: #aaa; line-height: 2; }

/* SIZE */
.size-row { display: flex; flex-direction: column; gap: 10px; position: relative; }
.size-head { display: flex; justify-content: space-between; align-items: baseline; }
.size-label { font-size: 9px; letter-spacing: 3px; text-transform: uppercase; color: #ccc; }
.size-chart-toggle {
  background: none; border: none;
  font-family: 'Share Tech Mono', monospace;
  font-size: 8px; letter-spacing: 2px; text-transform: uppercase;
  color: #aaa; border-bottom: 1px solid #ddd; padding: 0 0 1px;
  transition: color 0.15s;
}
.size-chart-toggle:hover { color: #000; border-color: #000; }
.size-btns { display: flex; gap: 6px; }
.size-btn {
  background: none; border: 1px solid #e0e0e0;
  font-family: 'Share Tech Mono', monospace;
  font-size: 10px; letter-spacing: 2px;
  padding: 8px 14px; transition: all 0.15s; color: #000;
}
.size-btn:hover { border-color: #000; }
.size-btn.sel { background: #000; color: #fff; border-color: #000; }
.work .size-btn.sel { background: #3a8a3a; border-color: #3a8a3a; }
.playa .size-btn.sel { background: #e0609a; border-color: #e0609a; }

/* SIZE POPUP — name + numbers, flat card. Appears on size-button hover,
   or full table via SIZE CHART toggle. No picture. */
.size-pop {
  position: absolute; bottom: calc(100% + 8px); left: 0;
  background: #fff; border: 1px solid #000;
  padding: 12px 14px; z-index: 20;
  font-size: 9px; letter-spacing: 1.5px;
  opacity: 0; pointer-events: none;
  transform: translateY(4px);
  transition: opacity 0.15s, transform 0.15s;
  min-width: 200px;
}
.size-pop.show { opacity: 1; transform: translateY(0); }
.size-pop .sp-title {
  font-size: 8px; letter-spacing: 3px; text-transform: uppercase;
  color: #aaa; margin-bottom: 8px;
}
.size-pop table { border-collapse: collapse; width: 100%; }
.size-pop td { padding: 3px 0; }
.size-pop td:last-child { text-align: right; }

/* FULL CHART (toggle) */
.size-chart-full {
  display: none;
  border: 1px solid #000;
  font-size: 9px; letter-spacing: 1.5px;
}
.size-chart-full.open { display: block; }
.size-chart-full table { border-collapse: collapse; width: 100%; }
.size-chart-full th, .size-chart-full td {
  padding: 8px 10px; text-align: center;
  border-bottom: 1px solid #eee; border-right: 1px solid #eee;
}
.size-chart-full th {
  font-weight: normal; font-size: 8px; letter-spacing: 2px;
  text-transform: uppercase; color: #aaa;
}
.size-chart-full th:first-child, .size-chart-full td:first-child { text-align: left; }
.size-chart-full tr:last-child td { border-bottom: none; }
.size-chart-full th:last-child, .size-chart-full td:last-child { border-right: none; }
.size-chart-note { font-size: 8px; letter-spacing: 1px; color: #ccc; padding: 8px 10px; }

/* ATC */
.btn-atc {
  display: block; width: 100%; text-align: center;
  background: #000; color: #fff; border: none;
  font-family: 'Share Tech Mono', monospace;
  font-size: 10px; letter-spacing: 4px; text-transform: uppercase;
  padding: 16px; transition: background 0.2s;
}
.work:hover .btn-atc { background: #3a8a3a; }
.playa:hover .btn-atc { background: #e0609a; }

/* CART DRAWER */
.cart-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.2);
  opacity: 0; pointer-events: none; transition: opacity 0.25s; z-index: 200;
}
.cart-overlay.open { opacity: 1; pointer-events: auto; }
.cart-drawer {
  position: fixed; top: 0; right: -360px; width: 340px; max-width: 90vw;
  height: 100vh; background: #fff; border-left: 1px solid #000;
  z-index: 201; transition: right 0.28s ease;
  display: flex; flex-direction: column;
}
.cart-drawer.open { right: 0; }
.cart-head {
  display: flex; justify-content: space-between; align-items: center;
  padding: 18px 20px; border-bottom: 1px solid #eee;
  font-size: 10px; letter-spacing: 4px; text-transform: uppercase;
}
.cart-close { background: none; border: none; font-family: 'Share Tech Mono', monospace; font-size: 14px; }
.cart-items { flex: 1; overflow-y: auto; padding: 10px 20px; }
.cart-empty { font-size: 9px; letter-spacing: 2px; color: #ccc; text-transform: uppercase; padding: 30px 0; text-align: center; }
.cart-item {
  display: flex; justify-content: space-between; align-items: center;
  padding: 14px 0; border-bottom: 1px solid #f2f2f2;
  font-size: 10px; letter-spacing: 1px;
}
.ci-name { text-transform: uppercase; letter-spacing: 2px; }
.ci-size { color: #aaa; font-size: 9px; margin-top: 3px; }
.ci-qty { display: flex; align-items: center; gap: 8px; }
.ci-qty button {
  background: none; border: 1px solid #ddd; width: 20px; height: 20px;
  font-family: 'Share Tech Mono', monospace; font-size: 10px; line-height: 1;
}
.ci-qty button:hover { border-color: #000; }
.ci-remove { background: none; border: none; color: #ccc; font-family: 'Share Tech Mono', monospace; font-size: 9px; }
.ci-remove:hover { color: #f00; }
.cart-foot { padding: 16px 20px 20px; border-top: 1px solid #eee; }
.cart-total {
  display: flex; justify-content: space-between;
  font-size: 10px; letter-spacing: 3px; text-transform: uppercase;
  margin-bottom: 14px;
}
.btn-checkout {
  display: block; width: 100%; text-align: center;
  background: #000; color: #fff; border: none;
  font-family: 'Share Tech Mono', monospace;
  font-size: 10px; letter-spacing: 4px; text-transform: uppercase;
  padding: 15px; text-decoration: none;
}
.btn-checkout:hover { background: #333; }

/* FOOTER */
.bottom-links {
  display: flex; align-items: center; justify-content: center;
  gap: 40px; padding: 18px;
  font-size: 9px; letter-spacing: 4px; text-transform: uppercase;
  border-top: 1px solid #f0f0f0; background: #fff;
}
.bottom-links a { color: #000; text-decoration: none; transition: opacity 0.2s; }
.bottom-links a:hover { opacity: 0.3; }

@media (max-width: 760px) {
  .products-wrap { grid-template-columns: 1fr; }
  .product { border-right: none; border-bottom: 1px solid #eee; }
  nav { padding: 0 20px; }
  .product-info { padding: 20px; }
  .img-arrows { opacity: 1; }
  .size-pop { display: none; } /* mobile uses full chart toggle */
  .bottom-links { gap: 20px; flex-wrap: wrap; }
}
</style>
</head>
<body>

<nav>
  <a class="nav-logo" href="index.html"><img src="assets/logo-black.png" alt="MPƎ"></a>
  <button class="nav-cart" id="nav-cart" onclick="openCart()">Cart (0)</button>
</nav>

<div class="products-wrap">

  <!-- WORK DENIM -->
  <div class="product work" id="prod-work">
    <div class="img-wrap" id="gallery-work">
      <div class="img-arrows">
        <button class="img-arrow" onclick="galleryPrev('work')">←</button>
        <button class="img-arrow" onclick="galleryNext('work')">→</button>
      </div>
      <div class="img-dots" id="dots-work"></div>
    </div>
    <div class="product-info">
      <div class="info-top">
        <span class="product-name">Work Denim</span>
        <span class="product-price">$175</span>
      </div>
      <p class="product-desc">16oz Selvedge Denim · Carpenter Fit · Button Fly<br>Hammer loop · Multi-pocket · Season 01</p>
      <div class="size-row">
        <div class="size-head">
          <span class="size-label">Size</span>
          <button class="size-chart-toggle" onclick="toggleChart('work')">Size Chart</button>
        </div>
        <div class="size-btns" id="sizes-work">
          <button class="size-btn" data-size="30">30</button>
          <button class="size-btn" data-size="32">32</button>
          <button class="size-btn" data-size="34">34</button>
          <button class="size-btn" data-size="36">36</button>
        </div>
        <div class="size-pop" id="pop-work"></div>
        <div class="size-chart-full" id="chart-work"></div>
      </div>
      <button class="btn-atc" id="atc-work" onclick="addToCart('work')">Select Size to Add to Cart</button>
    </div>
  </div>

  <!-- PLAYA DENIM -->
  <div class="product playa" id="prod-playa">
    <div class="img-wrap" id="gallery-playa">
      <div class="img-arrows">
        <button class="img-arrow" onclick="galleryPrev('playa')">←</button>
        <button class="img-arrow" onclick="galleryNext('playa')">→</button>
      </div>
      <div class="img-dots" id="dots-playa"></div>
    </div>
    <div class="product-info">
      <div class="info-top">
        <span class="product-name">Playa Denim</span>
        <span class="product-price">$175</span>
      </div>
      <p class="product-desc">14oz Washed Selvedge Denim · Bootcut · 5-Pocket<br>CD embroidery · Raw hem · Season 01</p>
      <div class="size-row">
        <div class="size-head">
          <span class="size-label">Size</span>
          <button class="size-chart-toggle" onclick="toggleChart('playa')">Size Chart</button>
        </div>
        <div class="size-btns" id="sizes-playa">
          <button class="size-btn" data-size="30">30</button>
          <button class="size-btn" data-size="32">32</button>
          <button class="size-btn" data-size="34">34</button>
          <button class="size-btn" data-size="36">36</button>
        </div>
        <div class="size-pop" id="pop-playa"></div>
        <div class="size-chart-full" id="chart-playa"></div>
      </div>
      <button class="btn-atc" id="atc-playa" onclick="addToCart('playa')">Select Size to Add to Cart</button>
    </div>
  </div>

</div>

<div class="bottom-links">
  <a href="https://www.instagram.com/mp3inc/" target="_blank" rel="noopener">Instagram</a>
  <a href="https://www.youtube.com/@MP%C6%8E" target="_blank" rel="noopener">YouTube</a>
  <a href="https://open.spotify.com/playlist/5wjrDxEc2YOO9acKqpU4ZJ" target="_blank" rel="noopener">Spotify</a>
  <a href="mp3-terms.html">T&amp;S</a>
</div>

<!-- CART DRAWER -->
<div class="cart-overlay" id="cart-overlay" onclick="closeCart()"></div>
<aside class="cart-drawer" id="cart-drawer">
  <div class="cart-head">
    <span>Cart</span>
    <button class="cart-close" onclick="closeCart()">×</button>
  </div>
  <div class="cart-items" id="cart-items"></div>
  <div class="cart-foot">
    <div class="cart-total"><span>Total</span><span id="cart-total">$0</span></div>
    <a class="btn-checkout" id="btn-checkout" href="#" target="_blank" rel="noopener">Checkout</a>
  </div>
</aside>

<script>
/* ---------- DATA ---------- */
const VARIANTS = {
  work:  { "30": "41283054469163", "32": "41283054501931", "34": "41283054534699", "36": "41283054567467" },
  playa: { "30": "41283064889387", "32": "41283064922155", "34": "41283064954923", "36": "41283064987691" }
};
const NAMES = { work: "Work Denim", playa: "Playa Denim" };
const PRICE = 175;

/* Measurements in inches, garment laid flat.
   EDIT THESE to match the actual garments before launch. */
const MEASURES = {
  work: {
    "30": { "Waist": "31\"", "Front Rise": "11.5\"", "Thigh": "13\"",   "Inseam": "32\"", "Leg Opening": "9\""    },
    "32": { "Waist": "33\"", "Front Rise": "12\"",   "Thigh": "13.5\"", "Inseam": "32\"", "Leg Opening": "9.5\""  },
    "34": { "Waist": "35\"", "Front Rise": "12.5\"", "Thigh": "14\"",   "Inseam": "32\"", "Leg Opening": "10\""   },
    "36": { "Waist": "37\"", "Front Rise": "13\"",   "Thigh": "14.5\"", "Inseam": "32\"", "Leg Opening": "10.5\"" }
  },
  playa: {
    "30": { "Waist": "31\"", "Front Rise": "10.5\"", "Thigh": "11.5\"", "Inseam": "33\"", "Leg Opening": "10\""   },
    "32": { "Waist": "33\"", "Front Rise": "11\"",   "Thigh": "12\"",   "Inseam": "33\"", "Leg Opening": "10.5\"" },
    "34": { "Waist": "35\"", "Front Rise": "11.5\"", "Thigh": "12.5\"", "Inseam": "33\"", "Leg Opening": "11\""   },
    "36": { "Waist": "37\"", "Front Rise": "12\"",   "Thigh": "13\"",   "Inseam": "33\"", "Leg Opening": "11.5\"" }
  }
};

const IMGS = {
  work: ["assets/img_cc9faf10.jpg","assets/img_c02bf270.jpg","assets/img_874b547c.jpg","assets/img_4637cd2a.jpg","assets/img_4d805a22.jpg","assets/img_29d7d569.jpg","assets/img_91a6ab08.jpg"],
  playa: ["assets/img_a2b3382c.jpg","assets/img_70fdb513.jpg","assets/img_01bdfc5f.jpg","assets/img_47740f63.jpg","assets/img_a4470a47.jpg"]
};

/* ---------- GALLERY ---------- */
const gstate = { work: 0, playa: 0 };
function buildGallery(id) {
  const wrap = document.getElementById('gallery-' + id);
  const dots = document.getElementById('dots-' + id);
  IMGS[id].forEach((src, i) => {
    const img = document.createElement('img');
    img.src = src; img.loading = i === 0 ? 'eager' : 'lazy';
    img.className = i === 0 ? 'active' : '';
    wrap.insertBefore(img, wrap.querySelector('.img-arrows'));
    const dot = document.createElement('button');
    dot.className = 'img-dot' + (i === 0 ? ' active' : '');
    dot.onclick = () => goTo(id, i);
    dots.appendChild(dot);
  });
}
function goTo(id, idx) {
  const wrap = document.getElementById('gallery-' + id);
  const imgs = wrap.querySelectorAll('img');
  const dots = document.getElementById('dots-' + id).querySelectorAll('.img-dot');
  imgs[gstate[id]].classList.remove('active');
  dots[gstate[id]].classList.remove('active');
  gstate[id] = idx;
  imgs[gstate[id]].classList.add('active');
  dots[gstate[id]].classList.add('active');
}
function galleryNext(id) { goTo(id, (gstate[id] + 1) % IMGS[id].length); }
function galleryPrev(id) { goTo(id, (gstate[id] - 1 + IMGS[id].length) % IMGS[id].length); }
['work','playa'].forEach(id => {
  const el = document.getElementById('gallery-' + id);
  let sx = 0;
  el.addEventListener('touchstart', e => sx = e.touches[0].clientX, {passive:true});
  el.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - sx;
    if (dx < -40) galleryNext(id);
    else if (dx > 40) galleryPrev(id);
  });
});
buildGallery('work');
buildGallery('playa');

/* ---------- SIZE SELECT + POPUP ---------- */
const selected = { work: null, playa: null };

function popHTML(id, size) {
  const m = MEASURES[id][size];
  let rows = '';
  for (const k in m) rows += '<tr><td>' + k + '</td><td>' + m[k] + '</td></tr>';
  return '<div class="sp-title">' + NAMES[id] + ' — Size ' + size + '</div><table>' + rows + '</table>';
}

['work','playa'].forEach(id => {
  const pop = document.getElementById('pop-' + id);
  document.querySelectorAll('#sizes-' + id + ' .size-btn').forEach(btn => {
    const size = btn.dataset.size;
    btn.addEventListener('mouseenter', () => {
      pop.innerHTML = popHTML(id, size);
      pop.classList.add('show');
    });
    btn.addEventListener('mouseleave', () => pop.classList.remove('show'));
    btn.addEventListener('click', () => {
      document.querySelectorAll('#sizes-' + id + ' .size-btn').forEach(b => b.classList.remove('sel'));
      btn.classList.add('sel');
      selected[id] = size;
      document.getElementById('atc-' + id).textContent = 'Add to Cart — Size ' + size;
      if (window.MP3Sound) MP3Sound.tick();
    });
  });
});

/* full chart toggle */
function chartHTML(id) {
  const sizes = Object.keys(MEASURES[id]);
  const fields = Object.keys(MEASURES[id][sizes[0]]);
  let head = '<tr><th>Size</th>' + fields.map(f => '<th>' + f + '</th>').join('') + '</tr>';
  let body = sizes.map(s =>
    '<tr><td>' + s + '</td>' + fields.map(f => '<td>' + MEASURES[id][s][f] + '</td>').join('') + '</tr>'
  ).join('');
  return '<table>' + head + body + '</table><div class="size-chart-note">Garment measured flat · Inches</div>';
}
function toggleChart(id) {
  const el = document.getElementById('chart-' + id);
  if (!el.innerHTML) el.innerHTML = chartHTML(id);
  el.classList.toggle('open');
  if (window.MP3Sound) MP3Sound.tick();
}

/* ---------- CART ---------- */
let cart = [];
try { cart = JSON.parse(localStorage.getItem('mp3-cart') || '[]'); } catch (e) { cart = []; }

function saveCart() { localStorage.setItem('mp3-cart', JSON.stringify(cart)); }
function cartCount() { return cart.reduce((n, i) => n + i.qty, 0); }

function addToCart(id) {
  const size = selected[id];
  if (!size) {
    const btn = document.getElementById('atc-' + id);
    btn.textContent = 'Select a Size First';
    setTimeout(() => btn.textContent = 'Select Size to Add to Cart', 1200);
    return;
  }
  const vid = VARIANTS[id][size];
  const ex = cart.find(i => i.variant === vid);
  if (ex) ex.qty++;
  else cart.push({ product: id, size: size, variant: vid, qty: 1 });
  saveCart(); renderCart(); openCart();
  if (window.MP3Sound) MP3Sound.scratch();
}

function renderCart() {
  const list = document.getElementById('cart-items');
  document.getElementById('nav-cart').textContent = 'Cart (' + cartCount() + ')';
  if (!cart.length) {
    list.innerHTML = '<div class="cart-empty">Cart is empty</div>';
    document.getElementById('cart-total').textContent = '$0';
    document.getElementById('btn-checkout').href = 'https://0hiuxa-fs.myshopify.com/cart';
    return;
  }
  list.innerHTML = cart.map((i, idx) =>
    '<div class="cart-item">' +
      '<div><div class="ci-name">' + NAMES[i.product] + '</div><div class="ci-size">Size ' + i.size + ' · $' + PRICE + '</div></div>' +
      '<div class="ci-qty">' +
        '<button onclick="qty(' + idx + ',-1)">−</button><span>' + i.qty + '</span><button onclick="qty(' + idx + ',1)">+</button>' +
        '<button class="ci-remove" onclick="removeItem(' + idx + ')">×</button>' +
      '</div>' +
    '</div>'
  ).join('');
  document.getElementById('cart-total').textContent = '$' + cart.reduce((n, i) => n + i.qty * PRICE, 0);
  const permalink = 'https://0hiuxa-fs.myshopify.com/cart/' + cart.map(i => i.variant + ':' + i.qty).join(',');
  document.getElementById('btn-checkout').href = permalink;
}

function qty(idx, d) {
  cart[idx].qty += d;
  if (cart[idx].qty <= 0) cart.splice(idx, 1);
  saveCart(); renderCart();
  if (window.MP3Sound) MP3Sound.tick();
}
function removeItem(idx) { cart.splice(idx, 1); saveCart(); renderCart(); }

function openCart() {
  document.getElementById('cart-drawer').classList.add('open');
  document.getElementById('cart-overlay').classList.add('open');
}
function closeCart() {
  document.getElementById('cart-drawer').classList.remove('open');
  document.getElementById('cart-overlay').classList.remove('open');
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeCart(); });

renderCart();
</script>
